<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>クリアチェッカー</title>
    
    <!-- ホーム画面追加（PWA）用の特殊設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="クリアチェッカー">
    
    <!-- アプリアイコン（✅マークのSVGデータを埋め込み） -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232c3e50%22/><text y=%2270%22 x=%2210%22 font-size=%2260%22>✅</text></svg>">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22%E3%82%AF%E3%83%AA%E3%82%A2%E3%83%81%E3%82%A7%E3%83%83%E3%82%AB%E3%83%BC%22,%22short_name%22:%22%E3%83%9F%E3%83%83%E3%82%B7%E3%83%A7%E3%83%B3%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%232c3e50%22,%22theme_color%22:%22%232c3e50%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%232c3e50%27/%3E%3Ctext y=%2770%27 x=%2710%27 font-size=%2760%27%3E%E2%9C%85%3C/text%3E%3C/svg%3E%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}]}">

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 20px;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top); /* スマホのノッチ（上部の切り欠き）対策 */
        }
        h1 { margin-bottom: 5px; font-size: 1.8rem; color: #f1c40f; }
        .hint { font-size: 0.7rem; color: #95a5a6; margin-bottom: 15px; }
        
        .progress-text { font-size: 0.9rem; margin-bottom: 5px; color: #bdc3c7; }
        .progress-container {
            width: 100%; max-width: 500px;
            background-color: #34495e; height: 12px;
            border-radius: 6px; margin: 0 auto 20px; overflow: hidden;
        }
        .progress-bar {
            height: 100%; background-color: #2ecc71;
            width: 0%; transition: width 0.4s ease;
        }

        .controls {
            margin-bottom: 25px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .input-area { display: flex; justify-content: center; gap: 5px; width: 100%; }
        input[type="text"] {
            padding: 12px; font-size: 16px; border: none;
            border-radius: 8px; width: 60%; max-width: 300px; outline: none;
            color: #333;
        }
        .add-btn {
            padding: 12px 20px; background-color: #3498db;
            color: white; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer;
        }
        .bulk-delete-btn {
            padding: 8px 15px; background-color: transparent;
            color: #e74c3c; border: 1px solid #e74c3c; border-radius: 20px;
            font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
        }
        .bulk-delete-btn:hover { background-color: #e74c3c; color: white; }

        .task-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; max-width: 800px; margin: 0 auto;
        }

        .task-item {
            aspect-ratio: 1.5 / 1;
            background-color: #ecf0f1; color: #2c3e50;
            border-radius: 12px; display: flex;
            align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer;
            position: relative; overflow: hidden;
            transition: transform 0.2s, opacity 0.2s; padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            user-select: none;
            -webkit-user-select: none;
        }
        .task-item.dragging {
            opacity: 0.5;
            transform: scale(1.05);
        }

        /* CLEAR! のスタンプ演出 */
        .task-item.cleared::after {
            content: 'CLEAR!';
            position: absolute; color: #e74c3c;
            font-size: 1.8rem; font-weight: 900;
            border: 4px solid #e74c3c; padding: 2px 8px;
            border-radius: 8px; transform: rotate(-20deg);
            opacity: 0.8; pointer-events: none;
            animation: stamp 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes stamp {
            0% { transform: rotate(-20deg) scale(3); opacity: 0; }
            100% { transform: rotate(-20deg) scale(1); opacity: 0.8; }
        }

        .task-item.cleared { background-color: #bdc3c7; color: #95a5a6; }

        .delete-btn {
            position: absolute; top: 5px; right: 5px;
            background: rgba(0,0,0,0.1); border: none;
            border-radius: 50%; width: 28px; height: 28px;
            color: #7f8c8d; cursor: pointer; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }

        /* 紙吹雪エフェクト */
        .confetti {
            position: fixed; pointer-events: none; z-index: 100;
            font-size: 20px; animation: fall 1.5s linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>MISSION CHECKER</h1>
    <div class="hint">ドラッグで並べ替え / 長押し・右クリックで編集</div>
    
    <div class="progress-text" id="progressText">0 / 0 COMPLETED</div>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

    <div class="controls">
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="新しいミッション..." onkeypress="if(event.key==='Enter')addTask()">
            <button class="add-btn" onclick="addTask()">追加</button>
        </div>
        <button class="bulk-delete-btn" onclick="bulkDelete()">クリア済みを一括削除</button>
    </div>

    <div id="taskList" class="task-grid"></div>

    <script>
        const STORAGE_KEY = 'mission_checker_pwa_final';

        document.addEventListener('DOMContentLoaded', renderTasks);

        function getTasks() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
        }

        function saveTasks(tasks) { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;
            const tasks = getTasks();
            tasks.push({ id: Date.now().toString(), text: text, cleared: false });
            saveTasks(tasks);
            input.value = '';
            renderTasks();
        }

        function toggleClear(id) {
            const tasks = getTasks();
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.cleared = !task.cleared;
                saveTasks(tasks);
                renderTasks();
                if (task.cleared) { playFanfare(); createConfetti(); }
            }
        }

        function editTask(event, id) {
            if(event) event.preventDefault(); 
            const tasks = getTasks();
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            const newText = prompt('ミッションを編集:', task.text);
            if (newText !== null && newText.trim() !== "") {
                task.text = newText.trim();
                saveTasks(tasks);
                renderTasks();
            }
        }

        function deleteTask(event, id) {
            event.stopPropagation();
            if(!confirm('この項目を削除しますか？')) return;
            saveTasks(getTasks().filter(t => t.id !== id));
            renderTasks();
        }

        function bulkDelete() {
            const tasks = getTasks();
            const clearedCount = tasks.filter(t => t.cleared).length;
            if (clearedCount === 0) return alert('クリア済みの項目はありません。');
            if (confirm(`クリア済みの ${clearedCount} 件をすべて削除しますか？`)) {
                saveTasks(tasks.filter(t => !t.cleared));
                renderTasks();
            }
        }

        // --- ドラッグ＆ドロップ ＆ タッチ長押し ---
        let dragSrcId = null;
        let touchTimeout = null;

        function handleDragStart(e) {
            dragSrcId = this.dataset.id;
            this.classList.add('dragging');
            if(e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            return false;
        }

        function handleDrop(e) {
            e.stopPropagation();
            const targetId = this.dataset.id;
            if (dragSrcId !== targetId) {
                let tasks = getTasks();
                const fromIndex = tasks.findIndex(t => t.id === dragSrcId);
                const toIndex = tasks.findIndex(t => t.id === targetId);
                
                const [movedTask] = tasks.splice(fromIndex, 1);
                tasks.splice(toIndex, 0, movedTask);
                
                saveTasks(tasks);
                renderTasks();
            }
            return false;
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
        }

        function handleTouchStart(id) {
            touchTimeout = setTimeout(() => {
                editTask(null, id);
            }, 800);
        }

        function handleTouchEnd() {
            if (touchTimeout) clearTimeout(touchTimeout);
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            const tasks = getTasks();
            list.innerHTML = '';
            
            const clearedCount = tasks.filter(t => t.cleared).length;
            const percent = tasks.length ? Math.round((clearedCount / tasks.length) * 100) : 0;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').textContent = `${clearedCount} / ${tasks.length} COMPLETED (${percent}%)`;

            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = `task-item ${task.cleared ? 'cleared' : ''}`;
                div.draggable = true;
                div.dataset.id = task.id;
                
                div.onclick = () => toggleClear(task.id);
                div.oncontextmenu = (e) => editTask(e, task.id);
                
                div.addEventListener('dragstart', handleDragStart);
                div.addEventListener('dragover', handleDragOver);
                div.addEventListener('drop', handleDrop);
                div.addEventListener('dragend', handleDragEnd);

                div.addEventListener('touchstart', () => handleTouchStart(task.id));
                div.addEventListener('touchend', handleTouchEnd);
                div.addEventListener('touchmove', handleTouchEnd);
                
                div.innerHTML = `<span>${task.text}</span><button class="delete-btn" onclick="deleteTask(event, '${task.id}')">×</button>`;
                list.appendChild(div);
            });
        }

        function playFanfare() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const playTone = (freq, start, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.03, start);
                    gain.gain.exponentialRampToValueAtTime(0.01, start + duration);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(start); osc.stop(start + duration);
                };
                playTone(523.25, ctx.currentTime, 0.1);
                playTone(659.25, ctx.currentTime + 0.15, 0.1);
                playTone(783.99, ctx.currentTime + 0.3, 0.4);
            } catch(e) {}
        }

        function createConfetti() {
            const emojis = ['✨', '🌟', '🎉', '🎊', '🎈'];
            for (let i = 0; i < 15; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                c.style.left = Math.random() * 100 + 'vw';
                c.style.animationDelay = Math.random() * 0.3 + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 1600);
            }
        }
    </script>
</body>
</html>
